name: Import and rebrand complete Bana Bot system

on:
  push:
    paths:
      - '.github/workflows/import-bana.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout empty Bana Bot repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Clone entire LiyubetBot source
        run: git clone --depth 1 https://github.com/tekleabkidus-commits/LiyubetBot.git /tmp/liyubetbot-source
      - name: Import and rebrand code, paths and styling
        run: python3 scripts/import_bana.py
      - name: Validate source syntax and brand references
        shell: bash
        run: |
          set -e
          python3 -m py_compile scripts/import_bana.py
          find app config database routes tests -name '*.php' -print0 | xargs -0 -P 4 -n 1 php -l >/tmp/bana-php-lint.log
          echo "PHP syntax: passed"
          test -f public/css/bana-identity.css
          test -f app/Providers/Filament/AdminPanelProvider.php
          grep -q 'Bana Bot Studio' app/Providers/Filament/AdminPanelProvider.php
          echo "Brand and theme: passed"
      - name: Commit complete standalone Bana Bot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Telegram system and rebrand as Bana Bot with aqua/navy UI" || true
          git push origin HEAD:main
      - name: Report import
        run: |
          echo "Imported repository tree:"
          git ls-files | wc -l
          echo "Commit: $(git rev-parse HEAD)"
